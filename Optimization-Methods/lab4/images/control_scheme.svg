  <path class="line" d="M 20 95 H 95"/>

  <circle cx="115" cy="95" r="17" stroke="#111" stroke-width="2" fill="#fff"/>
  <path class="plain" d="M 103 83 L 127 107"/>
  <path class="plain" d="M 127 83 L 103 107"/>

  <text class="math" x="143" y="73">ν</text>
  <path class="line" d="M 132 95 H 195"/>

  <rect class="box" x="195" y="55" width="140" height="80"/>
  <text class="text" x="213" y="104">Регулятор</text>

  <text class="math" x="365" y="73">kμ</text>
  <path class="line" d="M 335 95 H 430"/>

  <rect class="box" x="430" y="55" width="185" height="80"/>
  <text class="text" x="458" y="88">Реактивные</text>
  <text class="text" x="475" y="121">двигатели</text>

  <text class="math" x="645" y="73">M</text>
  <path class="line" d="M 615 95 H 695"/>

