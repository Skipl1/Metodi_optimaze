  <text class="math" x="872" y="83">θ</text>
  <path class="line" d="M 840 95 H 885"/>

  <!-- Feedback path -->
  <path class="plain" d="M 860 95 V 220 H 115"/>
  <path class="line" d="M 115 220 V 113"/>
</svg>
