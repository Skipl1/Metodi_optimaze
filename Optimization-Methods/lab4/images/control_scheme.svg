    .box { stroke: #111; stroke-width: 2; fill: #fff; }
    .text { font-family: "Times New Roman", serif; font-size: 28px; fill: #111; }
    .math { font-family: "Times New Roman", serif; font-style: italic; font-size: 26px; fill: #111; }
  </style>

  <!-- Input, summing junction, and forward path -->
